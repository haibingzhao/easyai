<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>EasyAI — Backend Error</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #140f10;
      --text: #f0e8e6;
      --dim: #a08f8c;
      --faint: #6b5c59;
      --alarm: #ff6b5e;
      --amber: #ffb04a;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --display: "Avenir Next", "Segoe UI Variable Display", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 46px 54px 34px;
      font-family: var(--display);
      color: var(--text);
      background:
        radial-gradient(900px 480px at 88% -12%, rgba(255, 107, 94, 0.12), transparent 62%),
        radial-gradient(820px 460px at -8% 108%, rgba(255, 176, 74, 0.07), transparent 58%),
        var(--ink);
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(120% 90% at 50% 40%, #000 30%, transparent 100%);
    }

    /* ---- Brand ---- */
    .brand { animation: drop 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--alarm);
      box-shadow: 0 0 12px rgba(255, 107, 94, 0.9);
      animation: alarm 1.1s ease-in-out infinite;
    }
    @keyframes alarm {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .wordmark {
      margin-top: 14px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .rule {
      margin-top: 16px;
      height: 2px;
      width: 64px;
      background: linear-gradient(90deg, var(--alarm), transparent);
      animation: grow 0.8s 0.2s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes grow { from { width: 0; opacity: 0; } to { width: 64px; opacity: 1; } }

    /* ---- Fault report ---- */
    .report {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 24px 0;
      animation: rise 0.45s 0.15s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    .code-head {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--alarm);
      margin-bottom: 10px;
    }
    .message {
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--text);
      background: rgba(255, 107, 94, 0.055);
      border-left: 3px solid var(--alarm);
      border-radius: 0 8px 8px 0;
      padding: 16px 18px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-app-region: no-drag;
      user-select: text;
    }
    .message::-webkit-scrollbar { width: 8px; }
    .message::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
    .hint {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--dim);
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      -webkit-app-region: no-drag;
    }
    button {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 22px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.11);
      transform: translateY(-1px);
    }
    button:active { transform: translateY(0) scale(0.97); }
    button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    button.primary {
      background: var(--amber);
      border-color: var(--amber);
      color: #241a08;
      box-shadow: 0 4px 18px rgba(255, 176, 74, 0.28);
    }
    button.primary:hover {
      background: #ffc06e;
      box-shadow: 0 6px 22px rgba(255, 176, 74, 0.4);
    }

    /* ---- Footer rail ---- */
    .rail { animation: fade 0.6s 0.4s ease both; }
    .track {
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 107, 94, 0.22);
      animation: throb 2.4s ease-in-out infinite;
    }
    @keyframes throb {
      0%, 100% { background: rgba(255, 107, 94, 0.16); }
      50% { background: rgba(255, 107, 94, 0.34); }
    }
    .meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--faint);
    }

    @keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <header class="brand">
    <div class="eyebrow"><span class="led"></span>EasyAI · Fault Report</div>
    <h1 class="wordmark">Embedded backend failed to start</h1>
    <div class="rule"></div>
  </header>

  <section class="report">
    <div class="code-head">runtime · startup aborted</div>
    <div class="message" id="message">Unknown error.</div>
    <p class="hint">Your workspace and database are untouched. Retry, or open the backend log for details.</p>
    <div class="actions">
      <button class="primary" id="retry">Retry startup</button>
      <button id="logs">Open logs</button>
    </div>
  </section>

  <footer class="rail">
    <div class="track"></div>
    <div class="meta">
      <span>embedded runtime halted</span>
      <span>logs · {userData}/logs/backend-stdout.log</span>
    </div>
  </footer>

  <script>
    const api = window.easyaiDesktop;
    const el = document.getElementById('message');
    if (api && api.onStatus) {
      api.onStatus((s) => {
        if (s && s.phase === 'error' && typeof s.message === 'string') {
          el.textContent = s.message;
        }
      });
    }
    document.getElementById('retry').addEventListener('click', () => {
      if (api) api.restartBackend();
    });
    document.getElementById('logs').addEventListener('click', () => {
      if (api) api.openLogs();
    });
  </script>
</body>
</html>
