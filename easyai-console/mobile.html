<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      iOS 26.6.1 measured: `viewport-fit=cover` + `apple-mobile-web-app-status-bar-style=black-translucent`
      together make the layout viewport 812pt of an 874pt screen *pinned to physical y=0*, so the shell
      runs under the status bar and strands 62pt of unreachable screen below the tab bar. Dropping either
      one anchors the same 812pt viewport to the bottom instead ([62, 874]) — the normal look. `env()`
      stays 0 for the top inset in that geometry, which is correct; the bottom inset is still reported
      lazily (0 until the first keyboard interaction), see mobile.css.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <!-- A theme-color with alpha is dropped by every browser, so each scheme names its own surface. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EasyAI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/mobile-192.png" />
    <title>EasyAI</title>
    <style>
      /*
       * The shell sizes its own layout box (100dvh minus the keyboard), so the document must never
       * scroll. Leaving this on lets iOS pan the page when an input near the bottom is focused,
       * which strands the composer above a blank band.
       */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main-mobile.tsx"></script>
  </body>
</html>
