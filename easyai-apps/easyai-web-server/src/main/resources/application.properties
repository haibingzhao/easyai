# Spring Boot Application Properties
spring.application.name=agent-api
spring.threads.virtual.enabled=true
spring.output.ansi.enabled=ALWAYS
# Logging
logging.level.root=WARN
logging.level.com.easy.easyai=DEBUG
# Spring AI default ChatModel bean (required by AgentService, actual model configured via frontend)
spring.ai.anthropic.api-key=unused
# EasyAI Properties
easyai.work-dir=.
easyai.observability.enabled=false
# EasyAI System Properties - These will be registered as Java System Properties
# OpenTelemetry Properties (configure via environment variables if needed)
# easyai.system.otel.resource.attributes=service.name=easyai,service.version=2026.0.1,deployment.environment=test
# easyai.system.otel.exporter.otlp.protocol=http/protobuf
# easyai.system.otel.exporter.otlp.traces.endpoint=<your-otlp-endpoint>
# easyai.system.otel.exporter.otlp.metrics.endpoint=<your-otlp-endpoint>
# easyai.system.otel.exporter.otlp.headers=<your-otlp-headers>
# easyai.system.EXA_API_KEY=${EXA_API_KEY:}
# Feature Toggles
easyai.auth.enabled=true
easyai.swarm.enabled=true
easyai.memory.enabled=true
# Persistent JWT key pair (survives backend restarts)
easyai.auth.private-key-path=${user.home}/.easyai/jwt/private.pem
easyai.auth.public-key-path=${user.home}/.easyai/jwt/public.pem
