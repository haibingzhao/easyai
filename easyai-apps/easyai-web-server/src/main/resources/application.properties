# Spring Boot Application Properties
spring.application.name=agent-api
spring.threads.virtual.enabled=true
spring.output.ansi.enabled=ALWAYS
# Logging
logging.level.root=WARN
logging.level.com.easy.easyai=DEBUG
# EasyAI Properties
easyai.work-dir=.
easyai.observability.enabled=false
# EasyAI System Properties - These will be registered as Java System Properties
# OpenTelemetry Properties (configure via environment variables if needed)
# easyai.system.otel.resource.attributes=service.name=easyai,service.version=2026.0.1,deployment.environment=test
# easyai.system.otel.exporter.otlp.protocol=http/protobuf
# easyai.system.otel.exporter.otlp.traces.endpoint=<your-otlp-endpoint>
# easyai.system.otel.exporter.otlp.metrics.endpoint=<your-otlp-endpoint>
# easyai.system.otel.exporter.otlp.headers=<your-otlp-headers>
# easyai.system.EXA_API_KEY=${EXA_API_KEY:}
# Feature Toggles
easyai.auth.enabled=true
easyai.swarm.enabled=true
easyai.memory.enabled=true
easyai.script-llm.enabled=true
easyai.rag.enabled=true
easyai.skills.rag.enabled=true
easyai.domain=coding
# WebFlux multipart: required to enable multipart/form-data parsing
spring.webflux.multipart.max-in-memory-size=64MB
# Persistent JWT key pair (survives backend restarts)
easyai.auth.private-key-path=${user.home}/.easyai/jwt/private.pem
easyai.auth.public-key-path=${user.home}/.easyai/jwt/public.pem

# Response compression. Session transcripts are JSON and dominated by repeated tool output,
# so gzip is the cheapest payload win available. text/event-stream is deliberately absent:
# compressing SSE introduces buffering and would break token-by-token streaming.
server.compression.enabled=true
# An explicit list REPLACES Spring's default set rather than adding to it, so every type the
# default covered has to be repeated here — dropping application/xml would compress less than
# before this change. problem+json is included because that is what error responses actually use.
server.compression.mime-types=application/json,application/problem+json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=2048
