# ============================================================
# EasyAI Desktop Server — self-contained backend configuration
#
# Values here are safe defaults for standalone runs. The Electron
# shell overrides them via command-line arguments at spawn time:
#   --server.port={dynamic}
#   --easyai.r2dbc.url={userData-scoped H2 path | PostgreSQL URL}
#   --easyai.work-dir={user project directory}
# ============================================================
spring.application.name=easyai-desktop-server
spring.threads.virtual.enabled=true
spring.output.ansi.enabled=NEVER

# Logging: console-only (captured by the Electron shell into
# {userData}/logs/backend-stdout.log — see logback-spring.xml)
logging.level.root=WARN
logging.level.com.easy.easyai=INFO

# Server: overridden by Electron with a dynamically chosen free port
server.port=8090

# Frontend: easyai-console build output is injected into classpath:/static
# at build time; WebFlux serves it same-origin (welcome page + assets).
# No SPA fallback rewrite is needed because the console uses HashRouter.

# Database: embedded H2 file mode by default (zero-install, data under ~/.easyai/db).
# Electron overrides the URL for userData-scoped paths or PostgreSQL mode.
easyai.r2dbc.enabled=true
easyai.r2dbc.url=r2dbc:h2:file://${user.home}/.easyai/db/easyai;MODE=MYSQL
easyai.r2dbc.username=sa
easyai.r2dbc.password=

# EasyAI core
easyai.max-iterations=50
easyai.work-dir=${user.home}
easyai.observability.enabled=false

# Feature switches
easyai.auth.enabled=true
easyai.swarm.enabled=true
easyai.memory.enabled=true

# WebFlux multipart: required to enable multipart/form-data parsing
spring.webflux.multipart.max-in-memory-size=64MB

# Persistent JWT key pair (survives backend restarts)
easyai.auth.private-key-path=${user.home}/.easyai/jwt/private.pem
easyai.auth.public-key-path=${user.home}/.easyai/jwt/public.pem
