name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test
        run: ./mvnw clean install -B -q

      # The TTS catalog rows live in a generated Flyway migration plus a hot-patch script and the
      # plan's voice appendix. All three are derived from scripts/tts-voices.json; drift between them
      # would ship a migration whose checksum no longer matches a hand-edited script.
      - name: TTS catalog artifacts in sync
        run: python3 scripts/gen-tts-catalog.py --check

  frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyai-console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: easyai-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      # Hosts consume dist-lib with skipLibCheck; an unrewritten "@/*" specifier degrades the whole
      # type surface to any without failing their builds, so the published declarations are checked.
      - name: Build library declarations
        run: npm run build:lib

      - name: Assert no internal alias in declarations
        run: |
          if grep -rE "(from|import\()\s*['\"]@/" dist-lib --include='*.d.ts'; then
            echo "dist-lib still contains @/ alias specifiers"
            exit 1
          fi
